<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Admin - Questions</title>
    <link rel="stylesheet" href="styles.css?v=20261012.2" />
</head>
<body>
    <header class="topbar" id="topbar" hidden>
        <div>
            <h1>School Admin</h1>
            <p id="statusText">Moderate question bank questions</p>
        </div>
        <div class="topbar-actions">
            <a class="btn" href="index.html">Home</a>
            <a class="btn" href="taxonomy.html">Taxonomy</a>
            <a class="btn" href="submissions.html">Submissions</a>
            <button class="btn" id="refreshBtn" type="button">Refresh</button>
            <button class="btn" id="logoutBtn" type="button">Logout</button>
        </div>
    </header>

    <main class="app-shell">
        <section class="login-panel" id="loginView">
            <div>
                <h1>Questions</h1>
                <p>Sign in with your school Google account to moderate questions.</p>
            </div>
            <button class="btn primary wide-btn" id="loginBtn" type="button">Google Login</button>
            <a class="btn wide-btn" href="index.html">Back Home</a>
            <a class="btn wide-btn" href="taxonomy.html">Manage Taxonomy</a>
        </section>

        <section class="dashboard" id="dashboardView" hidden>
            <section class="panel action-panel">
                <div>
                    <h2>Question Moderation</h2>
                    <p id="adminLabel"></p>
                </div>
                <div class="action-bar">
                    <a class="btn" href="taxonomy.html">Taxonomy</a>
                    <button class="btn" id="markVerifiedBtn" type="button" disabled>Mark Verified</button>
                    <button class="btn" id="removeVerifiedBtn" type="button" disabled>Remove Verified</button>
                    <button class="btn danger" id="deleteSelectedBtn" type="button" disabled>Delete Selected</button>
                </div>
            </section>

            <section class="panel">
                <div class="toolbar">
                    <label class="field search-field">
                        <span>Search</span>
                        <input id="searchInput" type="search" placeholder="Prompt, author, taxonomy, id" />
                    </label>
                    <label class="field compact-field">
                        <span>Status</span>
                        <select id="statusFilter">
                            <option value="all">All</option>
                            <option value="published">Published</option>
                            <option value="draft">Draft</option>
                            <option value="archived">Archived</option>
                        </select>
                    </label>
                    <label class="field compact-field">
                        <span>Type</span>
                        <select id="typeFilter">
                            <option value="all">All</option>
                            <option value="mcq">MCQ</option>
                            <option value="short_answer">Short Answer</option>
                            <option value="fib">Fill in the Blank</option>
                            <option value="true_false">True / False</option>
                        </select>
                    </label>
                    <label class="field compact-field">
                        <span>Difficulty</span>
                        <select id="difficultyFilter">
                            <option value="all">All</option>
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                            <option value="blank">Not set</option>
                        </select>
                    </label>
                    <label class="field compact-field">
                        <span>Verified</span>
                        <select id="verifiedFilter">
                            <option value="all">All</option>
                            <option value="verified">Verified</option>
                            <option value="unverified">Unverified</option>
                        </select>
                    </label>
                    <label class="field compact-field">
                        <span>Explanation</span>
                        <select id="explanationFilter">
                            <option value="all">All</option>
                            <option value="has">Has explanation</option>
                            <option value="missing">Missing</option>
                            <option value="translated">With Hindi &amp; Telugu translations</option>
                        </select>
                    </label>
                    <label class="field compact-field">
                        <span>Translation</span>
                        <select id="translationFilter">
                            <option value="all">All</option>
                            <option value="has">Has translations</option>
                            <option value="missing">Missing translations</option>
                        </select>
                    </label>
                    <label class="field compact-field">
                        <span>SECTION</span>
                        <select id="sectionFilter">
                            <option value="all">All</option>
                        </select>
                    </label>
                    <label class="field compact-field">
                        <span>Explanation URL</span>
                        <select id="explanationUrlFilter">
                            <option value="all">All</option>
                            <option value="has">Has URL</option>
                            <option value="missing">Missing</option>
                        </select>
                    </label>
                    <label class="field compact-field">
                        <span>Hints</span>
                        <select id="hintsFilter">
                            <option value="all">All</option>
                            <option value="has">Has hints</option>
                            <option value="missing">Missing</option>
                        </select>
                    </label>
                    <label class="field compact-field">
                        <span>Skill</span>
                        <select id="skillFilter">
                            <option value="all">All</option>
                            <option value="Listening">Listening</option>
                            <option value="Speaking">Speaking</option>
                            <option value="Reading">Reading</option>
                            <option value="Writing">Writing</option>
                        </select>
                    </label>
                    <label class="field compact-field">
                        <span>ACTFL Level</span>
                        <select id="actflLevelFilter">
                            <option value="all">All</option>
                            <option value="Novice Low">Novice Low</option>
                            <option value="Novice Mid">Novice Mid</option>
                            <option value="Novice High">Novice High</option>
                            <option value="Intermediate Low">Intermediate Low</option>
                            <option value="Intermediate Mid">Intermediate Mid</option>
                            <option value="Intermediate High">Intermediate High</option>
                            <option value="Advanced Low">Advanced Low</option>
                            <option value="Advanced Mid">Advanced Mid</option>
                            <option value="Advanced High">Advanced High</option>
                            <option value="Superior">Superior</option>
                            <option value="Distinguished">Distinguished</option>
                        </select>
                    </label>
                    <label class="field compact-field">
                        <span>ACTFL Sublevel</span>
                        <select id="actflSublevelFilter">
                            <option value="all">All</option>
                            <option value="blank">Blank</option>
                            <option value="Low">Low</option>
                            <option value="Mid">Mid</option>
                            <option value="High">High</option>
                        </select>
                    </label>
                    <label class="field compact-field">
                        <span>ACTFL Mode</span>
                        <select id="actflModeFilter">
                            <option value="all">All</option>
                            <option value="Interpersonal">Interpersonal</option>
                            <option value="Interpretive">Interpretive</option>
                            <option value="Presentational">Presentational</option>
                        </select>
                    </label>
                    <label class="field mini-field">
                        <span>Likes >=</span>
                        <input id="likesFilter" type="number" min="0" step="1" placeholder="0" />
                    </label>
                    <label class="field mini-field">
                        <span>Dislikes >=</span>
                        <input id="dislikesFilter" type="number" min="0" step="1" placeholder="0" />
                    </label>
                    <div class="toolbar-counts">
                        <button class="btn" id="exportBtn" type="button">Export</button>
                        <label class="btn file-btn">
                            Import
                            <input id="importInput" type="file" accept=".csv,text/csv" />
                        </label>
                        <span class="count-chip" id="questionCount">0</span>
                        <span class="count-chip" id="selectedCount">0 selected</span>
                    </div>
                </div>
                <div id="questionTableWrap" class="table-wrap"></div>
            </section>
        </section>
    </main>

    <dialog id="confirmDialog" class="modal preview-modal">
        <form id="confirmForm" class="modal-card">
            <div>
                <h2 id="confirmTitle">Confirm</h2>
                <p id="confirmText"></p>
            </div>
            <div id="previewList" class="preview-list"></div>
            <div class="form-actions">
                <button class="btn" id="cancelActionBtn" type="button">Cancel</button>
                <button class="btn danger" id="confirmActionBtn" type="submit">Confirm</button>
            </div>
        </form>
    </dialog>

    <dialog id="exportDialog" class="modal">
        <form id="exportForm" class="modal-card">
            <div>
                <h2>Export Questions</h2>
                <p>Choose the columns to include in the CSV.</p>
            </div>
            <div class="export-scope">
                <label><input type="radio" name="exportScope" value="filtered" checked /> <span id="exportFilteredLabel">Filtered questions</span></label>
                <label><input type="radio" name="exportScope" value="selected" /> <span id="exportSelectedLabel">Selected questions</span></label>
            </div>
            <div class="export-actions-row">
                <button class="btn" id="exportSelectAllBtn" type="button">Select All</button>
                <button class="btn" id="exportSelectNoneBtn" type="button">Select None</button>
            </div>
            <div id="exportColumnList" class="export-column-list"></div>
            <div class="form-actions">
                <button class="btn" id="cancelExportBtn" type="button">Cancel</button>
                <button class="btn primary" id="confirmExportBtn" type="submit">Download CSV</button>
            </div>
        </form>
    </dialog>

    <div id="toast" class="toast"></div>
    <script type="module" src="questions.js?v=20261012.2"></script>
</body>
</html>
