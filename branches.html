<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Branches</title><link rel="stylesheet" href="styles.css?v=20261106.1"></head>
<body data-kind="branch"><header class="topbar"><div><h1>School Branches</h1><p id="status" role="status" aria-live="polite">Sign in to manage school records</p></div><nav class="topbar-actions"><a class="btn" href="index.html">Sections</a><a class="btn" href="organisations.html">Organisations</a><a class="btn" href="branches.html">Branches</a><button class="btn" id="login" type="button">Google Login</button><button class="btn" id="logout" type="button" hidden>Logout</button></nav></header>
<main class="app-shell" id="dashboard" hidden><section class="panel"><h2 id="formTitle">New branch</h2><p>Codes are unique, ignore letter case, and cannot be changed after creation. Organisation and branch management requires a school admin.</p>
<form id="schoolForm"><div class="form-grid"><label class="field"><span>Code</span><input id="code" required maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9-]{0,31}" placeholder="DSS-SGD"></label><label class="field"><span>Name</span><input id="name" required maxlength="200"></label><label class="field"><span>Organisation</span><select id="orgId" required></select></label><label class="field"><span>Address</span><input id="address" maxlength="1000"></label></div><label class="toggle-field"><input id="enabled" type="checkbox" checked><span>Enabled</span></label><div class="form-actions"><button class="btn primary" id="save" type="submit">Save</button><button class="btn" id="cancel" type="button">New / Cancel Edit</button></div></form></section>
<section class="panel"><div class="toolbar"><label class="field search-field"><span>Search</span><input id="search" type="search" placeholder="Code, name or organisation"></label><button class="btn" id="refresh" type="button">Refresh</button></div><div class="table-wrap" id="records"></div></section></main><script type="module" src="schools.js?v=20261106.1"></script></body></html>
